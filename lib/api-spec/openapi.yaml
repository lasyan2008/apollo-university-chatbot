openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Apollo University Smart Chatbot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: schools
    description: Schools and programmes
  - name: chat
    description: RAG chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /schools:
    get:
      operationId: listSchools
      tags: [schools]
      summary: List all schools
      description: Returns all schools with their programmes
      responses:
        "200":
          description: List of schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a chat message
      description: Send a question and get a RAG-powered answer with source citations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Chat response with answer and sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Branch:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    School:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: string
        branches:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
      required:
        - id
        - name
        - shortName
        - branches
    ChatMessageInput:
      type: object
      properties:
        question:
          type: string
        branch_id:
          type: string
        school_id:
          type: string
      required:
        - question
        - branch_id
        - school_id
    ChatResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: string
      required:
        - answer
        - sources
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
